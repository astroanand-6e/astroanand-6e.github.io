<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Link-preview card template (1200x630). tools/og/render.py fills it from cards.json via the query
       string and screenshots it with headless Chrome. Not deployed (tools/ is in .vercelignore). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=block">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #050505; }
    body { position: relative; color: #f2efe9; font-family: Geist, system-ui, sans-serif; }
    .glow { position: absolute; inset: 0; background: radial-gradient(42% 70% at 82% 62%, rgba(225, 6, 0, 0.32), transparent 70%); }
    .grain { position: absolute; inset: 0; opacity: 0.08; background-image: radial-gradient(rgba(255,255,255,0.6) 0.6px, transparent 0.6px); background-size: 3px 3px; }
    .avatar { position: absolute; right: -30px; bottom: -251px; height: 860px; filter: drop-shadow(0 0 26px rgba(255, 42, 31, 0.45)); }
    .copy { position: absolute; left: 76px; top: 70px; width: 650px; display: grid; gap: 26px; }
    .kicker { font: 500 22px/1 'Geist Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: #ff3b2f; }
    h1 { font: italic 400 98px/0.94 'Instrument Serif', serif; letter-spacing: -0.02em; text-wrap: balance; }
    h1.long { font-size: 76px; }
    .line { font-size: 29px; line-height: 1.32; color: #b9b2a7; max-width: 600px; text-wrap: pretty; }
    .foot { position: absolute; left: 76px; bottom: 58px; display: flex; align-items: center; gap: 18px; font: 400 22px/1 'Geist Mono', monospace; color: #8f887d; }
    .seal { width: 46px; height: 46px; border: 2px solid #ff3b2f; border-radius: 9px; display: grid; place-items: center; transform: rotate(-6deg);
      font: italic 400 24px/1 'Instrument Serif', serif; color: #ff3b2f; }
    .rule { position: absolute; left: 76px; right: 76px; bottom: 128px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.18), transparent 70%); }
  </style>
</head>
<body>
  <div class="glow"></div><div class="grain"></div>
  <img class="avatar" src="../../assets/hero/stand.webp" alt="">
  <div class="copy">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="line" id="line"></p>
  </div>
  <div class="rule"></div>
  <div class="foot"><span class="seal">AT</span><span id="path"></span></div>
  <script>
    const q = new URLSearchParams(location.search);
    const set = (id, v) => { document.getElementById(id).textContent = v || ''; };
    set('kicker', q.get('kicker')); set('title', q.get('title')); set('line', q.get('line')); set('path', q.get('path'));
    if ((q.get('title') || '').length > 22) document.getElementById('title').classList.add('long');
  </script>
</body>
</html>
